name: snap

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: python3 tests/test_runner.py
      - uses: snapcore/action-build@v1
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

  publish:
    # Tags (v1.2.3) go to the Snap Store and a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snap-*
          merge-multiple: true
      - name: Upload to the Snap Store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          sudo snap install snapcraft --classic
          for s in *.snap; do snapcraft upload "$s" --release="${{ vars.SNAP_CHANNEL || 'edge' }}"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.snap"
          generate_release_notes: true
